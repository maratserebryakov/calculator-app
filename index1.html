<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор наличности</title>
    
    <!-- Встроенный CSS -->
    <style>
        /* Стили для тела документа */
        body {
            font-family: 'Arial Black', sans-serif;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
            padding: 1%;
        }
        
        /* Стили для поля ввода
        .input-container {
            margin-bottom: 1%;
            padding: 1%;
            background-color: #f9f9f9;
        }   */
        
        /* Остальные CSS стили... */
        /* (здесь можно разместить все остальные CSS правила) */
        /* Базовый сброс отступов */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Общие стили для мобильных устройств */
body {
    font-family: 'Arial Black', sans-serif;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #f5f5f5;
    padding: 1%; /* Минимальное пространство по краям */
}

/* Стили для поля ввода целевой суммы */
.input-container {
    margin-bottom: 1%;
    padding: 1%;
    background-color: #f9f9f9;
}

.input-container label {
    font-size: calc(2vw + 10px);
    margin-bottom: 0.5%;
}

.input-container input {
    width: 100%;
    padding: 1%;
    font-size: calc(2.5vw + 12px);
    border: 1px solid #ccc;
    border-radius: 4px;
}

/* Стили для таблицы */
table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1%;
    font-size: calc(2.5vw + 12px);
}

th, td {
    padding: 1%;
    border: 1px solid #ddd;
    text-align: right;
    font-size: inherit;
}

th {
    background-color: #f0f0f0;
}

input[type="number"] {
    width: 100%;
    padding: 0.8%;
    box-sizing: border-box;
    font-size: calc(2.5vw + 12px);
    border: 1px solid #ccc;
    border-radius: 4px;
}

/* Стили для результатов под таблицей */
#results {
    padding: 1%;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    gap: 0.8%;
}

#results p {
    margin: 0;
    font-size: calc(3vw + 14px);
    line-height: 1.2;
}

#results span {
    font-weight: bold;
    color: #007bff;
    font-size: calc(3.5vw + 16px);
}

/* Адаптация для маленьких экранов */
@media screen and (max-width: 480px) {
    table {
        font-size: calc(2.5vw + 10px);
    }

    #results p {
        font-size: calc(3vw + 12px);
    }

    #results span {
        font-size: calc(3.5vw + 14px);
    }
}

/* Улучшение визуальной составляющей */
table tr:nth-child(even) {
    background-color: #f9f9f9;
}

table tr:hover {
    background-color: #e0e0e0;
}

input[type="number"]:focus {
    outline: none;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
}

    </style>
</head>
<body>
    <!-- HTML разметка -->
    <div class="input-container">
        <label for="targetAmount">Введите целевую сумму:</label>
        <input type="number" id="targetAmount" step="1" placeholder="0" min="0">
    </div>

    <table id="cashTable">
        <thead>
            <tr>
                <th>Номинал</th>
                <th>Количество</th>
                <th>Сумма</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div id="results">
        <p>Общая сумма: <span id="total">0</span></p>
        <p>Сумма купюр: <span id="bills">0</span></p>
        <p>Сумма монет: <span id="coins">0</span></p>
        <p>Целевая сумма: <span id="target">0</span></p>
        <p>Разница: <span id="difference">0</span></p>
    </div>

    <!-- Встроенный JavaScript -->
    <script>
        // Исходные данные
        const data = [
            { value: 5000, type: 'купюра', count: 0, total: 0 },
            { value: 2000, type: 'купюра', count: 0, total: 0 },
            // Остальные номиналы...
       { value: 1000, type: 'купюра', count: 0, total: 0 },
    { value: 500, type: 'купюра', count: 0, total: 0 },
    { value: 100, type: 'купюра', count: 0, total: 0 },
    { value: 50, type: 'купюра', count: 0, total: 0 },
    { value: 10, type: 'купюра', count: 0, total: 0 },
    { value: 10, type: 'монета', count: 0, total: 0 },
    { value: 5, type: 'монета', count: 0, total: 0 },
    { value: 2, type: 'монета', count: 0, total: 0 },
    { value: 1, type: 'монета', count: 0, total: 0 }
];

let totalSum = 0;
let billsSum = 0;
let coinsSum = 0;
let targetAmount = 0; // Целевая сумма
let difference = 0;   // Разница

        ];

        // Остальные функции JavaScript...

        // Функция подсчета сумм
        function calculateTotals() {
            // Логика подсчета
            
    totalSum = 0;
    billsSum = 0;
    coinsSum = 0;
    
    data.forEach(item => {
        item.total = item.value * item.count;
        totalSum += item.total;
        
        if (item.type === 'купюра') {
            billsSum += item.total;
        } else {
            coinsSum += item.total;
        }
    });
    
    // Расчет разницы между общей суммой и целевой суммой
    difference = totalSum - targetAmount;
        }

        // Функция создания таблицы
        function createTable() {
            // Создание таблицы
            const tableBody = document.querySelector('#cashTable tbody');
    
    data.forEach(item => {
        const row = document.createElement('tr');
        
        // Номинал
        const cellNominal = document.createElement('td');
        cellNominal.textContent = item.value;
        
        // Количество
        const cellCount = document.createElement('td');
        const input = document.createElement('input');
        input.type = 'number';
        input.value = item.count;
        input.addEventListener('input', () => {
            item.count = parseInt(input.value);
            calculateTotals();
            updateTable();
        });
        cellCount.appendChild(input);
        
        // Сумма
        const cellTotal = document.createElement('td');
        cellTotal.textContent = item.total;
        
        row.appendChild(cellNominal);
        row.appendChild(cellCount);
        row.appendChild(cellTotal);
        tableBody.appendChild(row);
    });
        }
// Обновление таблицы
function updateTable() {
    const tableBody = document.querySelector('#cashTable tbody');
    tableBody.innerHTML = '';
    createTable();
    
    // Обновляем итоги под таблицей
    document.getElementById('total').textContent = totalSum;
    document.getElementById('bills').textContent = billsSum;
    document.getElementById('coins').textContent = coinsSum;
    document.getElementById('target').textContent = targetAmount;
    document.getElementById('difference').textContent = difference;
}
        // Инициализация
        window.addEventListener('DOMContentLoaded', () => {
            createTable();
            calculateTotals();
            updateTable();
                // Обработчик для поля целевой суммы
    document.getElementById('targetAmount').addEventListener('input', () => {
        targetAmount = parseInt(document.getElementById('targetAmount').value);
        calculateTotals();
        updateTable();
    });
        });
    </script>
</body>
</html>
